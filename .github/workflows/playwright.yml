name: Check Naming Conventions

on:
  pull_request:
    branches:
      - master

jobs:
  naming-conventions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "14" # or your preferred version

      - name: Install dependencies
        run: npm install

      - name: Run naming convention checks
        run: node ./unitTest/unitTest.js
